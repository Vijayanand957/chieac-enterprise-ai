name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_ops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_ops_test
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pytest tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install & lint frontend
        working-directory: frontend
        run: |
          npm install
          npm run lint --if-present
          npm run build

  build-and-push:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push backend image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/ai-ops-backend:${{ github.sha }} ./backend
          docker push ${{ env.ACR_NAME }}.azurecr.io/ai-ops-backend:${{ github.sha }}

      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/ai-ops-frontend:${{ github.sha }} ./frontend
          docker push ${{ env.ACR_NAME }}.azurecr.io/ai-ops-frontend:${{ github.sha }}

      - name: Deploy new revision to Azure Container Apps
        run: |
          az containerapp update \
            --name ai-ops-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/ai-ops-backend:${{ github.sha }}
          az containerapp update \
            --name ai-ops-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/ai-ops-frontend:${{ github.sha }}
