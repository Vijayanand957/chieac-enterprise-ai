name: Enterprise ETL Pipeline CI Workflow

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: retail_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Database Schema Setup
      run: |
        PGPASSWORD=postgrespassword psql -h localhost -U postgres -d retail_analytics -f schema.sql

    - name: Run ETL Script
      run: |
        python etl_pipeline.py
      env:
        DB_USER: postgres
        DB_PASSWORD: postgrespassword
        DB_HOST: localhost
        DB_PORT: 5432
        DB_NAME: retail_analytics
